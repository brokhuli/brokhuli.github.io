name: Deploy Astro site to Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  BUILD_PATH: "."

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Astro check
        run: npm run check

      - name: Validate content (cross-collection)
        run: npm run validate:content

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npx astro build --site "${{ steps.pages.outputs.origin }}" --base "${{ steps.pages.outputs.base_path }}"

      - name: Verify references/ is not shipped as runtime input
        run: |
          # Fails only on patterns that would actually depend on references/ at runtime:
          #   - relative URLs:  href="references/..."  src="references/..."
          #   - module imports: from "references/..."  import("references/...")
          # Absolute GitHub blob URLs and plain display text are allowed — they're
          # outbound links to source-of-truth, not runtime dependencies.
          pattern='(href|src)="references/|(from|import)[[:space:]]*\(?[[:space:]]*["'\'']references/'
          if grep -rEq "$pattern" dist/; then
            echo "::error::dist/ depends on references/ at runtime — that folder must never ship."
            grep -rEln "$pattern" dist/ || true
            exit 1
          fi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Playwright smoke tests
        run: npm run test:e2e

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_PATH }}/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
