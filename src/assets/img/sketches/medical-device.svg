<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 320 200"
     fill="none"
     stroke="currentColor"
     stroke-width="1.5"
     stroke-linecap="round"
     stroke-linejoin="round">
  <!-- Plunger cap (left end) -->
  <rect x="20" y="80" width="14" height="40" rx="2" />

  <!-- Plunger rod -->
  <line x1="34" y1="100" x2="80" y2="100" />
  <line x1="34" y1="92" x2="80" y2="92" />
  <line x1="34" y1="108" x2="80" y2="108" />

  <!-- Finger flange (vertical) -->
  <path d="M 80 60 L 92 60 L 92 140 L 80 140 Z" />

  <!-- Barrel (main body) -->
  <path d="M 92 75 L 240 75" />
  <path d="M 92 125 L 240 125" />

  <!-- Internal piston seal -->
  <path d="M 96 78 L 110 78 L 110 122 L 96 122 Z" />
  <line x1="105" y1="78" x2="105" y2="122" />

  <!-- Scale ticks (mL graduations) -->
  <line x1="125" y1="75" x2="125" y2="82" />
  <line x1="145" y1="75" x2="145" y2="82" />
  <line x1="165" y1="75" x2="165" y2="82" />
  <line x1="185" y1="75" x2="185" y2="82" />
  <line x1="205" y1="75" x2="205" y2="82" />
  <line x1="225" y1="75" x2="225" y2="82" />

  <line x1="135" y1="75" x2="135" y2="80" />
  <line x1="155" y1="75" x2="155" y2="80" />
  <line x1="175" y1="75" x2="175" y2="80" />
  <line x1="195" y1="75" x2="195" y2="80" />
  <line x1="215" y1="75" x2="215" y2="80" />

  <!-- Nozzle taper -->
  <path d="M 240 75 L 256 90 L 256 110 L 240 125" />

  <!-- Luer collar -->
  <rect x="256" y="92" width="14" height="16" />

  <!-- Needle hub -->
  <rect x="270" y="95" width="10" height="10" />

  <!-- Needle -->
  <line x1="280" y1="100" x2="305" y2="100" />
  <line x1="302" y1="98" x2="305" y2="100" />
  <line x1="302" y1="102" x2="305" y2="100" />

  <!-- Blueprint label/dimension hints -->
  <line x1="20" y1="160" x2="20" y2="170" />
  <line x1="280" y1="160" x2="280" y2="170" />
  <line x1="20" y1="165" x2="280" y2="165" stroke-dasharray="4 3" />
  <line x1="148" y1="50" x2="155" y2="40" />
  <line x1="148" y1="50" x2="158" y2="50" />
</svg>
