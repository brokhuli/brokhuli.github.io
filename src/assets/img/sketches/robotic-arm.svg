<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 320 240"
     fill="none"
     stroke="currentColor"
     stroke-width="1.5"
     stroke-linecap="round"
     stroke-linejoin="round">
  <!-- Floor / mounting plate -->
  <line x1="40" y1="220" x2="280" y2="220" />
  <line x1="60" y1="225" x2="80" y2="225" />
  <line x1="100" y1="225" x2="120" y2="225" />
  <line x1="140" y1="225" x2="160" y2="225" />
  <line x1="180" y1="225" x2="200" y2="225" />
  <line x1="220" y1="225" x2="240" y2="225" />

  <!-- Base trapezoid -->
  <path d="M 100 220 L 110 190 L 170 190 L 180 220 Z" />
  <line x1="115" y1="195" x2="115" y2="200" />
  <line x1="165" y1="195" x2="165" y2="200" />

  <!-- Vertical column -->
  <rect x="125" y="140" width="30" height="50" />
  <line x1="140" y1="145" x2="140" y2="185" />

  <!-- Shoulder pivot -->
  <circle cx="140" cy="140" r="10" />
  <circle cx="140" cy="140" r="3" />

  <!-- Upper arm -->
  <path d="M 140 140 L 220 80" />
  <path d="M 134 134 L 214 74" />
  <path d="M 146 146 L 226 86" />

  <!-- Elbow pivot -->
  <circle cx="220" cy="80" r="9" />
  <circle cx="220" cy="80" r="3" />

  <!-- Forearm -->
  <path d="M 220 80 L 270 120" />
  <path d="M 215 86 L 265 126" />
  <path d="M 225 74 L 275 114" />

  <!-- Wrist pivot -->
  <circle cx="270" cy="120" r="7" />

  <!-- Gripper -->
  <path d="M 270 120 L 290 130" />
  <path d="M 290 124 L 300 124" />
  <path d="M 290 136 L 300 136" />
  <path d="M 290 124 L 290 136" />

  <!-- Blueprint dimension hints -->
  <line x1="40" y1="100" x2="50" y2="100" />
  <line x1="45" y1="100" x2="45" y2="220" stroke-dasharray="3 3" />
  <line x1="40" y1="220" x2="50" y2="220" />
  <line x1="55" y1="155" x2="60" y2="160" />
  <line x1="55" y1="165" x2="60" y2="160" />
</svg>
