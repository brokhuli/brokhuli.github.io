<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 480 160"
     fill="none"
     stroke="currentColor"
     stroke-width="1.5"
     stroke-linecap="round"
     stroke-linejoin="round">
  <!-- Rail -->
  <line x1="10" y1="140" x2="470" y2="140" />
  <line x1="20" y1="146" x2="40" y2="146" />
  <line x1="60" y1="146" x2="80" y2="146" />
  <line x1="100" y1="146" x2="120" y2="146" />
  <line x1="140" y1="146" x2="160" y2="146" />
  <line x1="180" y1="146" x2="200" y2="146" />
  <line x1="220" y1="146" x2="240" y2="146" />
  <line x1="260" y1="146" x2="280" y2="146" />
  <line x1="300" y1="146" x2="320" y2="146" />
  <line x1="340" y1="146" x2="360" y2="146" />
  <line x1="380" y1="146" x2="400" y2="146" />
  <line x1="420" y1="146" x2="440" y2="146" />

  <!-- Train body: tail at left, aerodynamic nose at right -->
  <path d="M 30 130
           L 30 70
           Q 30 55 50 50
           L 380 50
           Q 410 50 430 70
           L 455 110
           Q 458 120 455 130
           Z" />

  <!-- Nose taper detail -->
  <path d="M 410 60 Q 432 75 450 100" />

  <!-- Cab window (right) -->
  <path d="M 395 65 L 415 65 Q 425 70 432 80 L 432 95 L 395 95 Z" />

  <!-- Side windows (passenger) -->
  <rect x="60"  y="68" width="40" height="22" rx="3" />
  <rect x="115" y="68" width="40" height="22" rx="3" />
  <rect x="170" y="68" width="40" height="22" rx="3" />
  <rect x="225" y="68" width="40" height="22" rx="3" />
  <rect x="280" y="68" width="40" height="22" rx="3" />
  <rect x="335" y="68" width="40" height="22" rx="3" />

  <!-- Body horizontal stripe -->
  <line x1="35" y1="105" x2="445" y2="105" />

  <!-- Door -->
  <line x1="105" y1="105" x2="105" y2="130" />
  <line x1="220" y1="105" x2="220" y2="130" />
  <line x1="335" y1="105" x2="335" y2="130" />

  <!-- Bogies (wheel housings) -->
  <rect x="55"  y="125" width="60" height="12" rx="2" />
  <rect x="200" y="125" width="60" height="12" rx="2" />
  <rect x="345" y="125" width="60" height="12" rx="2" />

  <!-- Wheels -->
  <circle cx="70"  cy="138" r="8" />
  <circle cx="100" cy="138" r="8" />
  <circle cx="215" cy="138" r="8" />
  <circle cx="245" cy="138" r="8" />
  <circle cx="360" cy="138" r="8" />
  <circle cx="390" cy="138" r="8" />

  <!-- Pantograph -->
  <line x1="200" y1="50" x2="200" y2="35" />
  <line x1="200" y1="35" x2="180" y2="20" />
  <line x1="200" y1="35" x2="220" y2="20" />
  <line x1="170" y1="20" x2="230" y2="20" />
</svg>
